<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
  xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
  width="1152"
  height="640"
  viewBox="0 0 1152 640"
  version="1.1">
  <title>36 by 20 Tower Defense Map Grid</title>
  <desc>Native 1152 by 640 map canvas with 32 pixel cells for Inkscape.</desc>

  <sodipodi:namedview
    id="namedview1"
    pagecolor="#505050"
    bordercolor="#eeeeee"
    inkscape:showpageshadow="2"
    showgrid="true"
    inkscape:zoom="0.75"
    inkscape:cx="576"
    inkscape:cy="320">
    <inkscape:grid
      type="xygrid"
      id="grid1"
      units="px"
      originx="0"
      originy="0"
      spacingx="32"
      spacingy="32"
      empspacing="4"
      visible="true"
      enabled="true" />
  </sodipodi:namedview>

  <defs>
    <pattern
      id="cell-grid"
      width="32"
      height="32"
      patternUnits="userSpaceOnUse">
      <path
        d="M 32,0 H 0 V 32"
        fill="none"
        stroke="#20252b"
        stroke-width="1"
        stroke-opacity="0.32" />
    </pattern>
  </defs>

  <g
    inkscape:groupmode="layer"
    inkscape:label="PAINT HERE"
    id="paint-layer" />

  <g
    inkscape:groupmode="layer"
    inkscape:label="GRID OVERLAY (toggle for export)"
    id="grid-overlay"
    sodipodi:insensitive="true">
    <rect
      x="0"
      y="0"
      width="1152"
      height="640"
      fill="url(#cell-grid)" />
    <rect
      x="1"
      y="1"
      width="1150"
      height="638"
      fill="none"
      stroke="#20252b"
      stroke-width="2"
      stroke-opacity="0.55" />
  </g>
</svg>
