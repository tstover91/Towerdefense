<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="720" viewBox="0 0 1320 720">
  <defs>
    <pattern id="farmGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#3E6624" stroke-width="1" opacity=".35"/>
    </pattern>
    <pattern id="cropRows" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M3 18V0M9 18V0M15 18V0" stroke="#D9A62F" stroke-width="4"/>
    </pattern>
    <style>
      .title{font:700 26px sans-serif;fill:#F8FAFC}.label{font:700 15px sans-serif;fill:#F8FAFC;paint-order:stroke;stroke:#17171C;stroke-width:5px;stroke-linejoin:round}
      .note{font:15px sans-serif;fill:#D8DEE9}.small{font:13px sans-serif;fill:#D8DEE9}.pathBed{fill:none;stroke:#9A602E;stroke-width:72;stroke-linecap:round;stroke-linejoin:round}
      .path{fill:none;stroke:#D69A45;stroke-width:58;stroke-linecap:round;stroke-linejoin:round}.rut{fill:none;stroke:#B97935;stroke-width:3;stroke-dasharray:12 10;opacity:.8}
      .fence{fill:none;stroke:#75451F;stroke-width:8;stroke-dasharray:8 16}.build{fill:#A8CC4333;stroke:#A8CC43;stroke-width:3;stroke-dasharray:8 6}
      .tree{fill:#517C26;stroke:#17171C;stroke-width:3}.tree2{fill:#3E6624;stroke:#17171C;stroke-width:3}.water{fill:#287D86;stroke:#174B62;stroke-width:6}
    </style>
  </defs>
  <rect width="1320" height="720" fill="#111827"/>
  <text x="20" y="32" class="title">Farm — Alien Gauntlet paint and decoration guide</text>

  <!-- Exact 960x648 map working area -->
  <g transform="translate(20 50)">
    <rect width="960" height="648" rx="8" fill="#719B2D" stroke="#17171C" stroke-width="5"/>
    <rect width="960" height="648" rx="8" fill="url(#farmGrid)"/>

    <!-- Dark framing grass -->
    <path d="M0 0H960V58C850 82 760 44 650 70C530 98 395 55 280 72C160 90 80 68 0 100Z" fill="#3E6624"/>
    <path d="M0 585C120 555 235 610 350 575C480 540 590 607 710 568C815 535 900 572 960 548V648H0Z" fill="#517C26"/>

    <!-- Crop/soil regions -->
    <rect x="90" y="203" width="250" height="75" rx="10" fill="#704326" stroke="#42291E" stroke-width="5"/>
    <rect x="100" y="211" width="230" height="59" rx="5" fill="url(#cropRows)"/>
    <rect x="610" y="382" width="235" height="80" rx="10" fill="#704326" stroke="#42291E" stroke-width="5"/>
    <rect x="620" y="391" width="215" height="62" rx="5" fill="url(#cropRows)"/>
    <path d="M420 198Q510 170 585 205L568 272Q500 250 425 274Z" fill="#88AD35" opacity=".72"/>
    <path d="M170 391Q260 365 350 399L332 462Q250 438 170 466Z" fill="#88AD35" opacity=".72"/>

    <!-- Alien Gauntlet route -->
    <path class="pathBed" d="M-10 130H835Q910 130 910 205Q910 280 835 280H125Q50 280 50 355Q50 430 125 430H835Q910 430 910 505Q910 565 835 565H-10"/>
    <path class="path" d="M-10 130H835Q910 130 910 205Q910 280 835 280H125Q50 280 50 355Q50 430 125 430H835Q910 430 910 505Q910 565 835 565H-10"/>
    <path class="rut" d="M-10 120H835Q920 120 920 205Q920 290 835 290H125Q40 290 40 355Q40 440 125 440H835Q920 440 920 505Q920 575 835 575H-10"/>
    <path class="rut" d="M-10 140H835Q900 140 900 205Q900 270 835 270H125Q60 270 60 355Q60 420 125 420H835Q900 420 900 505Q900 555 835 555H-10"/>

    <!-- Buildable power pockets: keep open -->
    <ellipse class="build" cx="826" cy="205" rx="62" ry="58"/><text x="826" y="210" text-anchor="middle" class="label">OPEN A</text>
    <ellipse class="build" cx="133" cy="355" rx="62" ry="58"/><text x="133" y="360" text-anchor="middle" class="label">OPEN B</text>
    <ellipse class="build" cx="480" cy="205" rx="55" ry="48"/><text x="480" y="210" text-anchor="middle" class="label">OPEN C</text>
    <ellipse class="build" cx="480" cy="505" rx="55" ry="48"/><text x="480" y="510" text-anchor="middle" class="label">OPEN D</text>

    <!-- Barn complex in middle island -->
    <rect x="385" y="326" width="190" height="78" rx="8" fill="#A83B2C" stroke="#17171C" stroke-width="6"/>
    <path d="M370 326L480 278L590 326Z" fill="#682822" stroke="#17171C" stroke-width="6"/>
    <rect x="457" y="350" width="46" height="54" fill="#75451F" stroke="#17171C" stroke-width="4"/>
    <circle cx="626" cy="340" r="34" fill="#A9B5B5" stroke="#17171C" stroke-width="6"/><rect x="592" y="340" width="68" height="65" fill="#687782" stroke="#17171C" stroke-width="6"/>
    <text x="512" y="378" text-anchor="middle" class="label">BARN + SILO</text>

    <!-- Pond in non-critical bottom corner -->
    <path class="water" d="M735 602Q775 555 840 585Q893 610 870 648H715Q706 628 735 602Z"/>
    <circle cx="750" cy="598" r="5" fill="#45B8B2"/><circle cx="800" cy="590" r="6" fill="#45B8B2"/>
    <text x="806" y="630" text-anchor="middle" class="label">POND</text>

    <!-- Orchard top right -->
    <g>
      <circle class="tree" cx="700" cy="55" r="25"/><circle class="tree2" cx="750" cy="72" r="27"/><circle class="tree" cx="802" cy="52" r="25"/><circle class="tree2" cx="854" cy="74" r="27"/><circle class="tree" cx="908" cy="48" r="25"/>
      <text x="804" y="88" text-anchor="middle" class="label">ORCHARD</text>
    </g>

    <!-- Farmhouse / windmill / hay top left -->
    <rect x="70" y="48" width="128" height="54" rx="6" fill="#A83B2C" stroke="#17171C" stroke-width="5"/>
    <path d="M55 48L134 12L213 48Z" fill="#682822" stroke="#17171C" stroke-width="5"/>
    <text x="134" y="82" text-anchor="middle" class="label">HOUSE</text>
    <circle cx="270" cy="65" r="26" fill="none" stroke="#A9B5B5" stroke-width="6"/><path d="M270 21V109M226 65H314M239 34L301 96M301 34L239 96" stroke="#A9B5B5" stroke-width="5"/>
    <rect x="260" y="62" width="20" height="62" fill="#75451F" stroke="#17171C" stroke-width="4"/>
    <g fill="#D9A62F" stroke="#17171C" stroke-width="3"><rect x="335" y="58" width="42" height="30"/><rect x="380" y="58" width="42" height="30"/><rect x="357" y="28" width="42" height="30"/></g>

    <!-- Boundary fences and sparse rocks/flowers -->
    <path class="fence" d="M15 108H450M510 108H675M12 600H650M875 600H945"/>
    <g fill="#747761" stroke="#17171C" stroke-width="3"><ellipse cx="365" cy="245" rx="12" ry="8"/><ellipse cx="590" cy="245" rx="14" ry="9"/><ellipse cx="330" cy="490" rx="13" ry="8"/><ellipse cx="690" cy="510" rx="12" ry="8"/></g>

    <!-- Spawn/base -->
    <circle cx="12" cy="130" r="13" fill="#A5F23D" stroke="#17171C" stroke-width="4"/><text x="24" y="112" class="label">SPAWN</text>
    <circle cx="12" cy="565" r="13" fill="#8C4DFF" stroke="#17171C" stroke-width="4"/><text x="24" y="548" class="label">BASE</text>
  </g>

  <!-- Right legend -->
  <g transform="translate(1004 72)">
    <text x="0" y="0" class="title">Color placement</text>
    <rect y="28" width="24" height="24" fill="#719B2D"/><text x="36" y="46" class="note">Base grass everywhere</text>
    <rect y="66" width="24" height="24" fill="#3E6624"/><text x="36" y="84" class="note">Dark outer framing</text>
    <rect y="104" width="24" height="24" fill="#88AD35"/><text x="36" y="122" class="note">Irregular grass patches</text>
    <rect y="142" width="24" height="24" fill="#D69A45"/><text x="36" y="160" class="note">Main dirt road</text>
    <rect y="180" width="24" height="24" fill="#9A602E"/><text x="36" y="198" class="note">Road edge and ruts</text>
    <rect y="218" width="24" height="24" fill="#704326"/><text x="36" y="236" class="note">Plowed soil beds</text>
    <rect y="256" width="24" height="24" fill="#D9A62F"/><text x="36" y="274" class="note">Wheat and hay</text>
    <rect y="294" width="24" height="24" fill="#A83B2C"/><text x="36" y="312" class="note">Barn focal accent</text>
    <rect y="332" width="24" height="24" fill="#287D86"/><text x="36" y="350" class="note">Small pond only</text>

    <text x="0" y="410" class="title">Decoration rules</text>
    <text x="0" y="442" class="note">• Keep OPEN A–D flat</text>
    <text x="0" y="468" class="note">• Tall props around edges</text>
    <text x="0" y="494" class="note">• Low crops between lanes</text>
    <text x="0" y="520" class="note">• Barn is central landmark</text>
    <text x="0" y="546" class="note">• Don’t outline every tile</text>
    <text x="0" y="572" class="note">• Use black on silhouettes</text>
  </g>
</svg>
