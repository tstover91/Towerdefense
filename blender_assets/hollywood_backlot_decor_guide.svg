    <text y="410" class="note">• Soundstages and facades block</text><text y="438" class="note">• Ground stars/paint do not block</text>
    <text y="466" class="note">• Keep merge visibility clean</text><text y="494" class="note">• OPEN A/B fit two towers deep</text>
