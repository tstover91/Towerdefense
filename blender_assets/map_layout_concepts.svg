<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#334155" stroke-width="1" opacity=".42"/>
    </pattern>
    <style>
      .panel{fill:#111827;stroke:#475569;stroke-width:3}.grid{fill:url(#grid)}
      .bed{fill:none;stroke:#64748b;stroke-width:32;stroke-linecap:round;stroke-linejoin:round}
      .route{fill:none;stroke:#38bdf8;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .alt{stroke:#f59e0b}.zone{fill:#22c55e44;stroke:#4ade80;stroke-width:3}
      .minor{fill:#a855f733;stroke:#c084fc;stroke-width:3}.block{fill:#1e293b;stroke:#94a3b8;stroke-width:2}
      .title{fill:#f8fafc;font:700 25px sans-serif}.sub{fill:#cbd5e1;font:17px sans-serif}
      .label{fill:#f8fafc;font:700 15px sans-serif;paint-order:stroke;stroke:#0f172a;stroke-width:5px;stroke-linejoin:round}
      .small{fill:#cbd5e1;font:14px sans-serif}.spawn{fill:#22c55e}.base{fill:#ef4444}
    </style>
  </defs>
  <rect width="1536" height="1024" fill="#0b1120"/>
  <text x="44" y="42" class="title" font-size="30">Tower Defense Map Layout Concepts</text>
  <text x="44" y="70" class="sub">Blue = enemy route · Green = primary power zone · Purple = secondary placement · Gray = blocked decoration</text>

  <!-- 1 Orbital Loop -->
  <g transform="translate(36 96)">
    <rect class="panel" width="464" height="420" rx="18"/><rect class="grid" x="14" y="58" width="436" height="294"/>
    <text x="22" y="36" class="title">1. Orbital Loop</text>
    <path class="bed" d="M18 105H400Q438 105 438 140V315H70Q22 315 22 275V150H370Q407 150 407 185V274H112Q62 274 62 235V193H335Q370 193 370 225V238H445"/>
    <path class="route" d="M18 105H400Q438 105 438 140V315H70Q22 315 22 275V150H370Q407 150 407 185V274H112Q62 274 62 235V193H335Q370 193 370 225V238H445"/>
    <rect class="block" x="182" y="202" width="98" height="52" rx="10"/><text x="231" y="233" text-anchor="middle" class="label">Reactor</text>
    <circle class="zone" cx="232" cy="177" r="38"/><text x="232" y="181" text-anchor="middle" class="label">CENTER</text>
    <circle class="minor" cx="414" cy="233" r="24"/>
    <circle class="spawn" cx="18" cy="105" r="9"/><circle class="base" cx="445" cy="238" r="9"/>
    <text x="20" y="380" class="small">Easy · repeated center coverage · broad tower freedom</text>
    <text x="20" y="403" class="small">Best for: cone, melee, support, learning the roster</text>
  </g>

  <!-- 2 Confluence -->
  <g transform="translate(536 96)">
    <rect class="panel" width="464" height="420" rx="18"/><rect class="grid" x="14" y="58" width="436" height="294"/>
    <text x="22" y="36" class="title">2. Confluence</text>
    <path class="bed" d="M18 100C110 100 142 140 218 205L445 310M18 310C110 310 142 270 218 205L445 310"/>
    <path class="route" d="M18 100C110 100 142 140 218 205L445 310M18 310C110 310 142 270 218 205L445 310"/>
    <rect class="block" x="75" y="160" width="95" height="90" rx="16"/><text x="123" y="211" text-anchor="middle" class="label">Crater</text>
    <circle class="zone" cx="228" cy="205" r="40"/><text x="228" y="210" text-anchor="middle" class="label">CHOKE</text>
    <circle class="minor" cx="349" cy="267" r="28"/>
    <circle class="spawn" cx="18" cy="100" r="9"/><circle class="spawn" cx="18" cy="310" r="9"/><circle class="base" cx="445" cy="310" r="9"/>
    <text x="20" y="380" class="small">Medium · two entrances merge into one kill zone</text>
    <text x="20" y="403" class="small">Best for: explosives at merge, beams on final straight</text>
  </g>

  <!-- 3 Figure Eight -->
  <g transform="translate(1036 96)">
    <rect class="panel" width="464" height="420" rx="18"/><rect class="grid" x="14" y="58" width="436" height="294"/>
    <text x="22" y="36" class="title">3. Figure Eight</text>
    <path class="bed" d="M18 205C80 78 177 78 232 205C287 332 384 332 446 205C384 78 287 78 232 205C177 332 80 332 18 205"/>
    <path class="route" d="M18 205C80 78 177 78 232 205C287 332 384 332 446 205C384 78 287 78 232 205C177 332 80 332 18 205"/>
    <circle class="zone" cx="232" cy="205" r="37"/><text x="232" y="210" text-anchor="middle" class="label">CROSS</text>
    <circle class="minor" cx="113" cy="108" r="25"/><circle class="minor" cx="351" cy="302" r="25"/>
    <rect class="block" x="202" y="73" width="60" height="48" rx="10"/><rect class="block" x="202" y="289" width="60" height="48" rx="10"/>
    <circle class="spawn" cx="18" cy="205" r="9"/><circle class="base" cx="446" cy="205" r="9"/>
    <text x="20" y="380" class="small">Medium · central crossfire plus useful outer bends</text>
    <text x="20" y="403" class="small">Best for: your first new map; nearly every role works</text>
  </g>

  <!-- 4 Twin Front -->
  <g transform="translate(36 552)">
    <rect class="panel" width="464" height="420" rx="18"/><rect class="grid" x="14" y="58" width="436" height="294"/>
    <text x="22" y="36" class="title">4. Twin Front</text>
    <path class="bed" d="M18 100H145Q200 100 218 165Q235 225 300 225H446M18 310H145Q200 310 218 245Q235 185 300 185H446"/>
    <path class="route" d="M18 100H145Q200 100 218 165Q235 225 300 225H446M18 310H145Q200 310 218 245Q235 185 300 185H446"/>
    <rect class="block" x="178" y="168" width="58" height="74" rx="10"/><rect class="block" x="275" y="168" width="58" height="74" rx="10"/>
    <circle class="zone" cx="255" cy="205" r="35"/><text x="255" y="210" text-anchor="middle" class="label">SHARED</text>
    <circle class="minor" cx="95" cy="205" r="26"/><circle class="minor" cx="385" cy="205" r="26"/>
    <circle class="spawn" cx="18" cy="100" r="9"/><circle class="spawn" cx="18" cy="310" r="9"/><circle class="base" cx="446" cy="185" r="9"/><circle class="base" cx="446" cy="225" r="9"/>
    <text x="20" y="380" class="small">Hard · two lanes briefly share tower coverage</text>
    <text x="20" y="403" class="small">Best for: testing balanced builds without global-range forcing</text>
  </g>

  <!-- 5 Breach Route -->
  <g transform="translate(536 552)">
    <rect class="panel" width="464" height="420" rx="18"/><rect class="grid" x="14" y="58" width="436" height="294"/>
    <text x="22" y="36" class="title">5. Breach Route</text>
    <path class="bed" d="M18 310H125V90H336V310H446"/><path class="route" d="M18 310H125V90H336V310H446"/>
    <path class="bed" d="M18 310H125Q220 310 250 205Q280 100 336 90H446"/><path class="route alt" d="M18 310H125Q220 310 250 205Q280 100 336 90H446"/>
    <rect class="block" x="185" y="105" width="115" height="65" rx="12"/><text x="243" y="143" text-anchor="middle" class="label">Mothership</text>
    <circle class="zone" cx="125" cy="205" r="32"/><circle class="minor" cx="336" cy="205" r="32"/><circle class="minor" cx="246" cy="226" r="25"/>
    <circle class="spawn" cx="18" cy="310" r="9"/><circle class="base" cx="446" cy="310" r="9"/>
    <text x="20" y="380" class="small">Advanced · predictable challenge rounds take orange shortcut</text>
    <text x="20" y="403" class="small">Best for: a visible map gimmick that changes positioning</text>
  </g>

  <!-- 6 Alien Gauntlet -->
  <g transform="translate(1036 552)">
    <rect class="panel" width="464" height="420" rx="18"/><rect class="grid" x="14" y="58" width="436" height="294"/>
    <text x="22" y="36" class="title">6. Alien Gauntlet</text>
    <path class="bed" d="M18 90H405Q445 90 445 130Q445 175 405 175H65Q22 175 22 220Q22 265 65 265H405Q445 265 445 310H18"/>
    <path class="route" d="M18 90H405Q445 90 445 130Q445 175 405 175H65Q22 175 22 220Q22 265 65 265H405Q445 265 445 310H18"/>
    <rect class="block" x="178" y="190" width="108" height="60" rx="12"/><text x="232" y="225" text-anchor="middle" class="label">Ruins</text>
    <circle class="zone" cx="415" cy="133" r="28"/><circle class="zone" cx="50" cy="220" r="28"/>
    <circle class="minor" cx="232" cy="133" r="24"/><circle class="minor" cx="340" cy="220" r="24"/>
    <circle class="spawn" cx="18" cy="90" r="9"/><circle class="base" cx="18" cy="310" r="9"/>
    <text x="20" y="380" class="small">Intermediate · hairpins alternate with long firing lanes</text>
    <text x="20" y="403" class="small">Best for: melee/cones on bends, pierce/beams on straights</text>
  </g>
</svg>
