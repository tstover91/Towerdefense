<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="720" viewBox="0 0 1320 720">
  <defs>
    <pattern id="cityGrid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#65717E" stroke-width="1" opacity=".24"/></pattern>
    <style>
      .title{font:700 26px sans-serif;fill:#F8FAFC}.label{font:700 15px sans-serif;fill:#F8FAFC;paint-order:stroke;stroke:#17171C;stroke-width:5px;stroke-linejoin:round}.note{font:15px sans-serif;fill:#D8DEE9}
      .roadEdge{fill:none;stroke:#20262E;stroke-width:80;stroke-linecap:round;stroke-linejoin:round}.road{fill:none;stroke:#3B4149;stroke-width:68;stroke-linecap:round;stroke-linejoin:round}.lane{fill:none;stroke:#E6B84A;stroke-width:3;stroke-dasharray:18 16}
      .build{fill:#35D8FF24;stroke:#35D8FF;stroke-width:3;stroke-dasharray:9 7}.building{stroke:#17171C;stroke-width:6}.tree{fill:#4F8A49;stroke:#17171C;stroke-width:3}
    </style>
  </defs>
  <rect width="1320" height="720" fill="#111827"/><text x="20" y="32" class="title">City — Crossing Grid paint and decoration guide</text>
  <g transform="translate(20 50)">
    <rect width="960" height="648" rx="8" fill="#7C8792" stroke="#17171C" stroke-width="5"/><rect width="960" height="648" fill="url(#cityGrid)"/>
    <rect x="18" y="18" width="155" height="92" rx="8" fill="#A84C3D" class="building"/><text x="96" y="69" text-anchor="middle" class="label">APARTMENTS</text>
    <rect x="520" y="18" width="205" height="90" rx="8" fill="#596574" class="building"/><text x="623" y="68" text-anchor="middle" class="label">OFFICES</text>
    <rect x="800" y="335" width="142" height="126" rx="8" fill="#A84C3D" class="building"/><text x="871" y="403" text-anchor="middle" class="label">HOTEL</text>
    <rect x="18" y="520" width="120" height="110" rx="8" fill="#596574" class="building"/><text x="78" y="580" text-anchor="middle" class="label">GARAGE</text>
    <rect x="555" y="515" width="205" height="112" rx="8" fill="#8D8B80" class="building"/><text x="658" y="576" text-anchor="middle" class="label">STATION</text>

    <rect x="245" y="345" width="135" height="96" rx="12" fill="#4F8A49" stroke="#2E6335" stroke-width="6"/><circle class="tree" cx="273" cy="374" r="14"/><circle class="tree" cx="348" cy="405" r="16"/><text x="313" y="401" text-anchor="middle" class="label">PARK</text>
    <path class="roadEdge" d="M-10 145H430V480H190V310H770V145H970"/><path class="road" d="M-10 145H430V480H190V310H770V145H970"/><path class="lane" d="M-10 145H430V480H190V310H770V145H970"/>
    <g stroke="#F8FAFC" stroke-width="5" opacity=".8"><path d="M392 278H420M392 290H420M392 330H420M392 342H420"/><path d="M440 270V296M452 270V296M440 324V350M452 324V350"/></g>

    <rect class="build" x="492" y="178" width="160" height="96" rx="16"/><text x="572" y="230" text-anchor="middle" class="label">OPEN A</text>
    <rect class="build" x="246" y="350" width="140" height="96" rx="16"/><text x="316" y="403" text-anchor="middle" class="label">OPEN B</text>
    <rect class="build" x="488" y="350" width="160" height="128" rx="16"/><text x="568" y="419" text-anchor="middle" class="label">OPEN C</text>
    <rect class="build" x="682" y="350" width="96" height="128" rx="16"/><text x="730" y="419" text-anchor="middle" class="label">OPEN D</text>

    <g fill="#29313B" stroke="#17171C" stroke-width="3"><rect x="210" y="190" width="48" height="24" rx="5"/><rect x="715" y="82" width="48" height="24" rx="5"/><rect x="835" y="210" width="48" height="24" rx="5"/></g>
    <g class="tree"><circle cx="185" cy="68" r="17"/><circle cx="225" cy="68" r="17"/><circle cx="770" cy="575" r="17"/><circle cx="810" cy="575" r="17"/></g>
    <circle cx="10" cy="145" r="13" fill="#A5F23D" stroke="#17171C" stroke-width="4"/><text x="24" y="125" class="label">SPAWN</text>
    <circle cx="948" cy="145" r="13" fill="#8C4DFF" stroke="#17171C" stroke-width="4"/><text x="928" y="125" text-anchor="end" class="label">BASE</text>
  </g>
  <g transform="translate(1004 72)">
    <text class="title">Color placement</text>
    <g transform="translate(0 28)"><rect width="24" height="24" fill="#7C8792"/><text x="36" y="18" class="note">Sidewalk/concrete base</text></g>
    <g transform="translate(0 66)"><rect width="24" height="24" fill="#3B4149"/><text x="36" y="18" class="note">Asphalt route</text></g>
    <g transform="translate(0 104)"><rect width="24" height="24" fill="#E6B84A"/><text x="36" y="18" class="note">Lane and curb accents</text></g>
    <g transform="translate(0 142)"><rect width="24" height="24" fill="#A84C3D"/><text x="36" y="18" class="note">Warm brick landmarks</text></g>
    <g transform="translate(0 180)"><rect width="24" height="24" fill="#596574"/><text x="36" y="18" class="note">Cool building mass</text></g>
    <g transform="translate(0 218)"><rect width="24" height="24" fill="#4F8A49"/><text x="36" y="18" class="note">Park/tree relief</text></g>
    <g transform="translate(0 256)"><rect width="24" height="24" fill="#37CFE0"/><text x="36" y="18" class="note">Small neon/cyan accents</text></g>
    <text y="338" class="title">Decoration rules</text>
    <text y="372" class="note">• Buildings and parked cars block</text><text y="400" class="note">• Crosswalks and markings do not</text>
    <text y="428" class="note">• Keep OPEN A–D completely flat</text><text y="456" class="note">• Use low props near the crossing</text>
    <text y="484" class="note">• Tall skyline props stay on edges</text><text y="512" class="note">• C fits two tower rows; A/B one</text>
  </g>
</svg>
